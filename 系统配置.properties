# ============================================================
# 长线价值增强项目 · 系统配置文件
# ------------------------------------------------------------
# 说明：
#   1. 所有配置项都在 [DEFAULT] 段下，每行都有中文注释。
#   2. 修改后保存即可，下次运行生效（无需改代码）。
#   3. 布尔值用 true/false，字符串直接写，数字写小数或整数。
# ============================================================

[DEFAULT]

# ==================== 1. 运行与账户 ====================

# 目标股票池（用英文逗号分隔，字母大写）
tickers=TSLA

# 本地模拟模式的初始资金（美元）。仅 trade_mode=alpaca
# trade_mode=alpaca
initial_capital=10000.0

# 是否在决策前联网更新最新行情和新闻（true=联网更新，false=用本地缓存）
enable_update=true

# 交易执行模式：local=本地记账 | alpaca=Alpaca模拟盘真实下单 | live=实盘(未实现)
trade_mode=alpaca

# ==================== 2. 调度与预测周期 ====================

# 预测周期（交易日）：模型预测"未来 N 天"涨跌。短线是1天，长线建议5天起步。
forecast_horizon=5

# 调度频率（天）：每隔 N 天跑一次决策。配合 cron 定时任务使用。
run_interval_days=5

# 盘中风控巡检间隔（分钟）：长任务模式(daemon)下每隔 N 分钟拉最新价检查止盈止损。
# 越小越灵敏（默认15分钟）。设为0则只按决策周期跑、不做盘中巡检。
patrol_interval_minutes=15

# ==================== 3. 数据与新闻 ====================

# 行情数据起始年份（拉取从这一年开始的历史数据，用于训练模型）
data_start_year=2020

# 新闻拉取条数（每次从新闻源取多少条新闻做情绪分析）
news_count=8

# 新闻时效窗口（天）：只分析最近 N 天内的新闻，过滤掉过旧消息
news_recent_days=7

# 每次参与情绪分析的新闻条数上限（控制 AI 调用耗时）
news_analyze_limit=5

# GDELT 历史新闻原始压缩包存储目录（只存含关键词的 gkg 压缩包，用时解压）。
# 留空 = 不保存原始包，下载后提取情绪即丢弃（省空间）。
# 建议指向移动硬盘，如 /Volumes/A/GDELT原始
gdelt_raw_dir=/Volumes/A/GDELT原始

# 是否全量保存 gkg 压缩包（true=不管含不含关键词都存，方便以后换股票复用；
# false=只存含关键词的包，省空间）。全量时约 576MB/天，118GB 硬盘约能存 200 天。
gdelt_save_all=true

# ==================== 4. 选股测试参数 ====================

# 选股测试的候选股票池（用英文逗号分隔，字母大写）。
# 选股测试会对这些候选股逐一回测，筛选出值得纳入 tickers 的标的。
candidate_pool=TSLA,NVDA,AAPL,MSFT,META,GOOGL

# 选股测试的回测天数：抽取最近 N 天作为"考卷"，之前的作为"教材"训练模型。
backtest_days=100

# ==================== 5. 技术指标参数 ====================

# 均线窗口（日）：计算 MA 均线用，默认 20 日均线
ma_window=20

# RSI 窗口（日）：相对强弱指标周期，默认 14
rsi_window=14

# MACD 快线周期（日）
macd_fast=12

# MACD 慢线周期（日）
macd_slow=26

# MACD 信号线周期（日）
macd_signal=9

# 大盘过滤均线（日）：QQQ 收盘价站上该均线视为牛市，允许做多
qqq_ma_window=200

# ==================== 6. 交易与风控 ====================

# 交易手续费率（0.002 表示千分之二，买卖各收一次）
trade_fee_rate=0.002

# 固定止损比例：持仓浮亏达到该比例就卖出（硬底线，防深套）
# TSLA 波动大，2% 太容易被震荡扫出，放宽到 5%（匹配其波动率，拿得住大趋势）
stop_loss_pct=0.05

# 移动止盈比例：从持仓最高点回撤该比例就止盈（保护利润）
# 放宽到 5%，让利润跑得更远，不被正常回撤洗出
trailing_take_profit_pct=0.05

# 移动止盈激活线：浮盈达到该比例后，才启用"从最高点回撤止盈"。
# 避免"刚建仓微涨后回落"就触发移动止盈（之前 bug：浮盈1.5%就误触发）。
trailing_activate_pct=0.02

# 是否允许卖出底仓（true=底仓也参与止盈止损，false=底仓永不卖）
allow_sell_core=true

# 单只股票最大仓位（占账户总资产的比例，0.10=10%）。
# alpaca 模式按真实账户总资产动态计算额度；local 模式按 initial_capital 计算。
# 例如账户 $100,000、仓位比例 0.10 → 单只最多动用 $10,000。
position_pct=0.10

# ==================== 7. 机器学习模型参数 ====================

# XGBoost 决策树数量（越大模型越复杂，越容易过拟合）
model_n_estimators=100

# 决策树最大深度（限制单棵树复杂度）
model_max_depth=3

# 学习率（越小越保守，训练越慢）
model_learning_rate=0.05

# 随机种子（固定它可以让每次训练结果可复现）
model_random_state=42
